<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cirugías CrubVet</title>

  <!-- Favicon (pestaña del navegador) -->
  <link rel="icon" type="image/jpeg" href="logo.jpeg">
  <link rel="shortcut icon" type="image/jpeg" href="logo.jpeg">

  <!-- Ícono al "Agregar a inicio" en iPhone/iPad -->
  <link rel="apple-touch-icon" href="logo.jpeg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CrubVet">

  <!-- Instalable en Android/Chrome -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <!-- Tailwind por CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .cirugia-card { transition: transform .08s ease; }
    .cirugia-card:hover { transform: translateY(-2px); }
    /* Ocultar controles de edición cuando el rol es solo lectura */
    body.solo-lectura .requiere-edicion { display: none !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- ============ PANTALLA DE LOGIN ============ -->
  <div id="pantallaLogin" class="fixed inset-0 z-40 bg-slate-800 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 sm:p-8">
      <div class="text-center mb-6">
        <div class="text-4xl mb-2">🐾</div>
        <h1 class="text-xl font-bold text-slate-700">Cirugías CrubVet</h1>
        <p class="text-sm text-slate-400">Inicia sesión para continuar</p>
      </div>
      <form id="formLogin" class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-slate-500">Usuario</label>
          <input id="loginUsuario" autocomplete="username" required
            class="w-full border rounded-lg px-3 py-2.5 text-sm mt-1" placeholder="ej: recepcion">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500">Contraseña</label>
          <input id="loginClave" type="password" autocomplete="current-password" required
            class="w-full border rounded-lg px-3 py-2.5 text-sm mt-1" placeholder="••••••••">
        </div>
        <p id="loginError" class="hidden text-sm text-red-600 text-center"></p>
        <button type="submit" id="btnLogin"
          class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg shadow">
          Iniciar sesión
        </button>
      </form>
    </div>
  </div>

  <!-- Todo el resto de la app queda oculto hasta iniciar sesión -->
  <div id="app" class="hidden">

  <!-- BARRA SUPERIOR -->
  <header class="bg-white shadow sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-2xl">🐾</span>
        <h1 class="text-base sm:text-lg font-bold text-slate-700 truncate">Cirugías CrubVet</h1>
      </div>
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="text-right leading-tight hidden sm:block">
          <p id="userNombre" class="text-sm font-semibold">Cargando…</p>
          <p id="userRol" class="text-xs text-slate-500"></p>
        </div>
        <button id="btnAgregar"
          class="requiere-edicion bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-3 sm:px-4 py-2 rounded-lg shadow whitespace-nowrap">
          <span class="sm:hidden text-lg leading-none">+</span>
          <span class="hidden sm:inline">+ Agregar Cirugía</span>
        </button>
        <button id="btnLogout" title="Cerrar sesión"
          class="text-slate-400 hover:text-red-600 text-sm px-2 py-2 rounded-lg">Salir</button>
      </div>
    </div>
    <!-- Datos de usuario en móvil -->
    <div class="sm:hidden px-3 pb-2 -mt-1 text-xs text-slate-500">
      <span id="userNombreM" class="font-semibold text-slate-700"></span>
      <span id="userRolM"></span>
    </div>
  </header>

  <!-- CONTROLES DE SEMANA -->
  <div class="max-w-7xl mx-auto px-3 sm:px-4 mt-3 sm:mt-4 flex items-center justify-between gap-2">
    <button id="btnPrev" class="px-3 py-2 bg-white rounded-lg shadow text-sm hover:bg-slate-50 whitespace-nowrap">
      <span class="sm:hidden">◀</span><span class="hidden sm:inline">◀ Semana anterior</span>
    </button>
    <h2 id="tituloSemana" class="font-semibold text-slate-700 text-center text-xs sm:text-base flex-1 min-w-0"></h2>
    <div class="flex gap-2">
      <button id="btnActualizar" title="Recargar desde la base de datos"
        class="px-3 py-2 bg-white rounded-lg shadow text-sm hover:bg-slate-50 whitespace-nowrap">
        <span class="sm:hidden">🔄</span><span class="hidden sm:inline">🔄 Actualizar</span>
      </button>
      <button id="btnHoy" class="px-3 py-2 bg-white rounded-lg shadow text-sm hover:bg-slate-50">Hoy</button>
      <button id="btnNext" class="px-3 py-2 bg-white rounded-lg shadow text-sm hover:bg-slate-50 whitespace-nowrap">
        <span class="sm:hidden">▶</span><span class="hidden sm:inline">Semana siguiente ▶</span>
      </button>
    </div>
  </div>

  <!-- CALENDARIO -->
  <main class="max-w-7xl mx-auto px-4 my-4">
    <div id="calendario" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-2"></div>
    <p id="cargando" class="text-center text-slate-400 py-8">Cargando cirugías…</p>
  </main>

  <!-- ============ MODAL FORMULARIO ============ -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 z-30 flex items-start justify-center overflow-y-auto p-2 sm:p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg my-4 sm:my-8">
      <div class="flex items-center justify-between px-5 py-3 border-b">
        <h3 id="modalTitulo" class="font-bold text-slate-700">Agregar Cirugía</h3>
        <button id="btnCerrar" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
      </div>

      <form id="formCirugia" class="p-5 space-y-3">
        <input type="hidden" id="cirugiaId">

        <!-- ===== SECCIÓN 1: FICHA MÉDICA ===== -->
        <h4 class="text-sm font-bold text-slate-700 border-b pb-1">🩺 Ficha médica</h4>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold text-slate-500">Nombre del animal</label>
            <input id="animal" required class="w-full border rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Tutor</label>
            <input id="tutor" class="w-full border rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Peso (kg)</label>
            <input id="peso" type="number" step="0.1" class="w-full border rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Especie</label>
            <input id="especie" class="w-full border rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Raza</label>
            <input id="raza" class="w-full border rounded-lg px-3 py-2 text-sm">
          </div>
          <div class="hidden sm:block"></div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Fecha</label>
            <input id="fecha" type="date" required class="w-full border rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Hora</label>
            <input id="hora" type="time" required class="w-full border rounded-lg px-3 py-2 text-sm">
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500">¿Por qué viene? (motivo de consulta)</label>
          <textarea id="motivo" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm"
            placeholder="Describe el motivo de la consulta o cirugía…"></textarea>
        </div>

        <!-- ===== SECCIÓN 2: ARCHIVOS ===== -->
        <div class="requiere-edicion space-y-2">
          <h4 class="text-sm font-bold text-slate-700 border-b pb-1">📂 Archivos</h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <span class="text-xs text-slate-500">🩸 Exámenes de sangre</span>
              <input id="archivo_sangre" type="file" multiple class="w-full text-xs border rounded-lg px-2 py-1.5 bg-slate-50">
            </div>
            <div>
              <span class="text-xs text-slate-500">🩻 Radiografías</span>
              <input id="archivo_rx" type="file" multiple class="w-full text-xs border rounded-lg px-2 py-1.5 bg-slate-50">
            </div>
            <div>
              <span class="text-xs text-slate-500">🫧 Ecografías</span>
              <input id="archivo_eco" type="file" multiple class="w-full text-xs border rounded-lg px-2 py-1.5 bg-slate-50">
            </div>
            <div>
              <span class="text-xs text-slate-500">❤️ Cardiólogo</span>
              <input id="archivo_cardio" type="file" multiple class="w-full text-xs border rounded-lg px-2 py-1.5 bg-slate-50">
            </div>
            <div>
              <span class="text-xs text-slate-500">📎 Otros</span>
              <input id="archivo_otros" type="file" multiple class="w-full text-xs border rounded-lg px-2 py-1.5 bg-slate-50">
            </div>
          </div>

          <!-- ===== SECCIÓN 3: PRESUPUESTO ===== -->
          <h4 class="text-sm font-bold text-slate-700 border-b pb-1 pt-2">💲 Presupuesto</h4>
          <div>
            <span class="text-xs text-slate-500">Adjuntar presupuesto</span>
            <input id="archivo_presupuesto" type="file" multiple class="w-full text-xs border rounded-lg px-2 py-1.5 bg-slate-50">
          </div>
        </div>

        <!-- Archivos ya adjuntos (en edición), agrupados por categoría -->
        <div id="archivosExistentes" class="hidden">
          <label class="text-xs font-semibold text-slate-500">Archivos adjuntos</label>
          <div id="listaArchivos" class="text-sm space-y-2 mt-1"></div>
        </div>

        <!-- Comentarios: cualquier rol puede leer y agregar -->
        <div id="seccionComentarios" class="hidden border-t pt-3">
          <label class="text-xs font-semibold text-slate-500">Comentarios</label>
          <ul id="listaComentarios" class="space-y-1 my-2"></ul>
          <div class="flex gap-2">
            <textarea id="nuevoComentario" rows="2" placeholder="Escribe un comentario…"
              class="flex-1 border rounded-lg px-3 py-2 text-sm"></textarea>
            <button type="button" id="btnComentar"
              class="px-3 py-2 rounded-lg text-sm bg-sky-600 hover:bg-sky-700 text-white font-semibold self-end whitespace-nowrap">Enviar</button>
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btnCancelar" class="px-4 py-2 rounded-lg text-sm bg-slate-200 hover:bg-slate-300">Cancelar</button>
          <button type="submit" id="btnGuardar"
            class="requiere-edicion px-4 py-2 rounded-lg text-sm bg-emerald-600 hover:bg-emerald-700 text-white font-semibold">
            Guardar
          </button>
        </div>
        <p id="msgGuardando" class="hidden text-center text-sm text-emerald-600">Guardando… no cierres la ventana.</p>
      </form>
    </div>
  </div>

  </div><!-- /#app -->

  <script>
    // =======================================================
    //  ESTADO GLOBAL
    // =======================================================
    // === URL de tu Apps Script (Implementar -> Aplicación web -> /exec) ===
    const API_URL = 'https://script.google.com/macros/s/AKfycbxbVC0g56-uZL46ntitaMkgrPYKgD-A5FMqDQ2X6yUomqPCaQSUiydq8LFNX_KgJKQpjg/exec';

    let USUARIO = null;          // { usuario, rol, nombre, puedeEditar }
    let CRED = null;             // { usuario, clave } -> se envía en cada llamada

    /**
     * Llama a la API de Apps Script por HTTP.
     * Usamos Content-Type 'text/plain' a propósito: evita la petición
     * "preflight" (OPTIONS) que Apps Script no responde y que rompería el CORS.
     */
    async function apiCall(action, payload) {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action }, payload || {}))
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Error del servidor');
      return json.data;
    }
    let CIRUGIAS = [];           // cache de cirugías
    let lunesActual = getLunes(new Date());  // lunes de la semana visible
    const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

    // =======================================================
    //  INICIALIZACIÓN
    // =======================================================
    window.addEventListener('DOMContentLoaded', function() {
      // Login
      document.getElementById('formLogin').onsubmit = onLogin;
      document.getElementById('btnLogout').onclick = cerrarSesion;

      // Listeners de UI de la app
      document.getElementById('btnPrev').onclick = () => moverSemana(-7);
      document.getElementById('btnNext').onclick = () => moverSemana(7);
      document.getElementById('btnHoy').onclick  = () => { lunesActual = getLunes(new Date()); render(); };
      document.getElementById('btnActualizar').onclick = cargarCirugias;
      document.getElementById('btnAgregar').onclick = abrirModalNuevo;
      document.getElementById('btnCerrar').onclick   = cerrarModal;
      document.getElementById('btnCancelar').onclick = cerrarModal;
      document.getElementById('formCirugia').onsubmit = onSubmit;
      document.getElementById('btnComentar').onclick = onComentar;
    });

    // Categorías de archivos: id del input -> etiqueta guardada
    const CATEGORIAS = [
      { id: 'archivo_sangre',      cat: 'Exámenes de sangre' },
      { id: 'archivo_rx',          cat: 'Radiografías' },
      { id: 'archivo_eco',         cat: 'Ecografías' },
      { id: 'archivo_cardio',      cat: 'Cardiólogo' },
      { id: 'archivo_otros',       cat: 'Otros' },
      { id: 'archivo_presupuesto', cat: 'Presupuesto' }
    ];

    // =======================================================
    //  LOGIN
    // =======================================================
    async function onLogin(e) {
      e.preventDefault();
      const usuario = document.getElementById('loginUsuario').value.trim();
      const clave   = document.getElementById('loginClave').value;
      const btn = document.getElementById('btnLogin');
      const err = document.getElementById('loginError');
      err.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Entrando…';

      try {
        const res = await apiCall('login', { usuario: usuario, clave: clave });
        if (!res || !res.ok) {
          err.textContent = (res && res.error) || 'Usuario o contraseña incorrectos.';
          err.classList.remove('hidden');
          return;
        }
        // Sesión OK: guardamos credenciales para las siguientes llamadas
        CRED = { usuario: usuario, clave: clave };
        USUARIO = res;
        iniciarApp();
      } catch (e2) {
        err.textContent = 'Error de conexión: ' + (e2 && e2.message ? e2.message : e2);
        err.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      }
    }

    function iniciarApp() {
      document.getElementById('pantallaLogin').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');

      document.getElementById('userNombre').textContent = USUARIO.nombre;
      document.getElementById('userRol').textContent = 'Rol: ' + USUARIO.rol;
      document.getElementById('userNombreM').textContent = USUARIO.nombre + ' · ';
      document.getElementById('userRolM').textContent = 'Rol: ' + USUARIO.rol;

      // Control de roles: si NO puede editar, ocultamos botones de edición
      document.body.classList.toggle('solo-lectura', !USUARIO.puedeEditar);
      cargarCirugias();
    }

    function cerrarSesion() {
      CRED = null; USUARIO = null; CIRUGIAS = [];
      document.getElementById('formLogin').reset();
      document.getElementById('app').classList.add('hidden');
      document.getElementById('pantallaLogin').classList.remove('hidden');
    }

    async function cargarCirugias() {
      const cargando = document.getElementById('cargando');
      cargando.style.display = '';
      cargando.textContent = 'Cargando cirugías…';
      try {
        const lista = await apiCall('getCirugias', { cred: CRED });
        CIRUGIAS = lista || [];
        cargando.style.display = 'none';
        render();
      } catch (e) {
        cargando.textContent = 'No se pudieron cargar las cirugías: ' + e.message;
      }
    }

    // =======================================================
    //  CALENDARIO SEMANAL (Lunes a Domingo)
    // =======================================================
    function getLunes(d) {
      const fecha = new Date(d);
      const dia = fecha.getDay();               // 0=domingo .. 6=sábado
      const diff = (dia === 0 ? -6 : 1 - dia);  // retrocede al lunes
      fecha.setDate(fecha.getDate() + diff);
      fecha.setHours(0,0,0,0);
      return fecha;
    }

    function moverSemana(dias) {
      lunesActual.setDate(lunesActual.getDate() + dias);
      render();
    }

    function fechaISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const dd = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${dd}`;
    }

    function render() {
      const cont = document.getElementById('calendario');
      cont.innerHTML = '';

      const domingo = new Date(lunesActual);
      domingo.setDate(domingo.getDate() + 6);
      document.getElementById('tituloSemana').textContent =
        `Semana: ${lunesActual.toLocaleDateString('es')} — ${domingo.toLocaleDateString('es')}`;

      const hoyISO = fechaISO(new Date());

      for (let i = 0; i < 7; i++) {
        const dia = new Date(lunesActual);
        dia.setDate(dia.getDate() + i);
        const iso = fechaISO(dia);

        const col = document.createElement('div');
        col.className = 'bg-white rounded-lg shadow min-h-[140px] flex flex-col';

        const esHoy = iso === hoyISO;
        col.innerHTML = `
          <div class="px-2 py-1.5 border-b text-center ${esHoy ? 'bg-emerald-600 text-white rounded-t-lg' : 'text-slate-500'}">
            <div class="text-xs font-semibold">${DIAS[i]}</div>
            <div class="text-xs">${dia.getDate()}/${dia.getMonth()+1}</div>
          </div>
          <div class="p-1.5 space-y-1.5 flex-1" data-dia="${iso}"></div>`;
        cont.appendChild(col);

        // Cirugías de ese día, ordenadas por hora
        const delDia = CIRUGIAS
          .filter(c => c.fecha === iso)
          .sort((a,b) => (a.hora||'').localeCompare(b.hora||''));

        const slot = col.querySelector('[data-dia]');
        delDia.forEach(c => slot.appendChild(tarjetaCirugia(c)));
      }
    }

    function tarjetaCirugia(c) {
      const div = document.createElement('div');
      div.className = 'cirugia-card cursor-pointer bg-sky-50 border border-sky-200 rounded-md p-1.5 text-xs';
      div.innerHTML = `
        <div class="font-bold text-sky-800">${escapar(c.hora || '')} · ${escapar(c.animal || '')}</div>
        <div class="text-slate-500">${escapar(c.especie || '')} ${c.peso ? '· '+escapar(c.peso)+'kg' : ''}</div>
        ${c.archivos && c.archivos.length ? `<div class="text-slate-400">📎 ${c.archivos.length}</div>` : ''}`;
      div.onclick = () => abrirModalEdicion(c);
      return div;
    }

    // =======================================================
    //  MODAL: NUEVO
    // =======================================================
    function abrirModalNuevo() {
      if (!USUARIO || !USUARIO.puedeEditar) return; // seguridad UI
      document.getElementById('formCirugia').reset();
      document.getElementById('cirugiaId').value = '';
      document.getElementById('modalTitulo').textContent = 'Agregar Cirugía';
      document.getElementById('archivosExistentes').classList.add('hidden');
      document.getElementById('seccionComentarios').classList.add('hidden'); // sin id todavía
      limpiarInputsArchivos();
      bloquearCamposSiLectura(false);
      abrirModal();
    }

    // =======================================================
    //  MODAL: EDICIÓN (carga datos existentes)
    // =======================================================
    function abrirModalEdicion(c) {
      document.getElementById('cirugiaId').value = c.id;
      document.getElementById('animal').value  = c.animal || '';
      document.getElementById('tutor').value   = c.tutor || '';
      document.getElementById('peso').value    = c.peso || '';
      document.getElementById('especie').value = c.especie || '';
      document.getElementById('raza').value    = c.raza || '';
      document.getElementById('motivo').value  = c.motivo || '';
      document.getElementById('fecha').value   = c.fecha || '';
      document.getElementById('hora').value    = c.hora || '';
      document.getElementById('modalTitulo').textContent =
        USUARIO.puedeEditar ? 'Editar Cirugía' : 'Detalle de Cirugía';

      limpiarInputsArchivos();
      renderArchivos(c.archivos);        // archivos ya adjuntos, agrupados por categoría
      renderComentarios(c.comentarios);  // comentarios existentes
      document.getElementById('seccionComentarios').classList.remove('hidden');

      // Roles de solo lectura: deshabilitar los campos de texto
      bloquearCamposSiLectura(!USUARIO.puedeEditar);
      abrirModal();
    }

    function bloquearCamposSiLectura(bloquear) {
      ['animal','tutor','peso','especie','raza','motivo','fecha','hora'].forEach(id => {
        document.getElementById(id).disabled = bloquear;
      });
    }

    function limpiarInputsArchivos() {
      CATEGORIAS.forEach(c => { const i = document.getElementById(c.id); if (i) i.value = ''; });
    }

    /** Muestra los archivos adjuntos agrupados por categoría (todos los roles pueden abrirlos). */
    function renderArchivos(archivos) {
      const cont = document.getElementById('listaArchivos');
      const wrap = document.getElementById('archivosExistentes');
      cont.innerHTML = '';
      if (!archivos || !archivos.length) { wrap.classList.add('hidden'); return; }

      const grupos = {};
      archivos.forEach(a => {
        const k = a.categoria || 'Otros';
        (grupos[k] = grupos[k] || []).push(a);
      });
      Object.keys(grupos).forEach(cat => {
        const bloque = document.createElement('div');
        let html = `<p class="text-xs font-semibold text-slate-600">${escapar(cat)}</p><ul class="ml-2">`;
        grupos[cat].forEach(a => {
          html += `<li><a href="${a.url}" target="_blank" class="text-sky-600 hover:underline">📄 ${escapar(a.nombre)}</a></li>`;
        });
        html += '</ul>';
        bloque.innerHTML = html;
        cont.appendChild(bloque);
      });
      wrap.classList.remove('hidden');
    }

    /** Muestra la lista de comentarios. */
    function renderComentarios(comentarios) {
      const ul = document.getElementById('listaComentarios');
      ul.innerHTML = '';
      if (!comentarios || !comentarios.length) {
        ul.innerHTML = '<li class="text-xs text-slate-400">Sin comentarios aún.</li>';
        return;
      }
      comentarios.forEach(c => {
        const li = document.createElement('li');
        li.className = 'bg-slate-50 border rounded-lg px-3 py-2 text-sm';
        li.innerHTML = `<div>${escapar(c.texto)}</div>
          <div class="text-xs text-slate-400 mt-0.5">${escapar(c.autor || '')} · ${escapar(c.fecha || '')}</div>`;
        ul.appendChild(li);
      });
    }

    /** Envía un comentario nuevo (disponible para cualquier rol). */
    async function onComentar() {
      const id = document.getElementById('cirugiaId').value;
      const ta = document.getElementById('nuevoComentario');
      const texto = ta.value.trim();
      if (!id || !texto) return;

      const btn = document.getElementById('btnComentar');
      btn.disabled = true; btn.textContent = '…';
      try {
        const res = await apiCall('agregarComentario', {
          datos: { usuario: CRED.usuario, clave: CRED.clave, id: id, texto: texto }
        });
        ta.value = '';
        renderComentarios(res.comentarios);
        const cir = CIRUGIAS.find(x => x.id === id);   // actualiza la caché local
        if (cir) cir.comentarios = res.comentarios;
      } catch (e) {
        onError(e);
      } finally {
        btn.disabled = false; btn.textContent = 'Enviar';
      }
    }

    function abrirModal() { document.getElementById('modal').classList.remove('hidden'); }
    function cerrarModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('msgGuardando').classList.add('hidden');
    }

    // =======================================================
    //  GUARDAR (crear o actualizar) + BASE64
    // =======================================================
    async function onSubmit(e) {
      e.preventDefault();
      if (!USUARIO.puedeEditar) return; // doble control

      const btn = document.getElementById('btnGuardar');
      btn.disabled = true;
      document.getElementById('msgGuardando').classList.remove('hidden');

      // Convertir archivos de TODAS las categorías a Base64 con FileReader
      const archivosB64 = await recolectarArchivosB64();

      const datos = {
        usuario: CRED.usuario,   // credenciales para validar en el servidor
        clave:   CRED.clave,
        id:      document.getElementById('cirugiaId').value,
        animal:  document.getElementById('animal').value,
        tutor:   document.getElementById('tutor').value,
        peso:    document.getElementById('peso').value,
        especie: document.getElementById('especie').value,
        raza:    document.getElementById('raza').value,
        motivo:  document.getElementById('motivo').value,
        fecha:   document.getElementById('fecha').value,
        hora:    document.getElementById('hora').value,
        archivos: archivosB64
      };

      try {
        await apiCall(datos.id ? 'actualizarCirugia' : 'crearCirugia', { datos: datos });
        cerrarModal();
        cargarCirugias(); // refresca el calendario
      } catch (err) {
        onError(err);
        document.getElementById('msgGuardando').classList.add('hidden');
      } finally {
        btn.disabled = false;
      }
    }

    /**
     * Recorre los inputs de cada categoría, convierte cada archivo a Base64
     * y le agrega su categoría. Devuelve [{ nombre, mimeType, base64, categoria }].
     */
    function recolectarArchivosB64() {
      const pares = [];
      CATEGORIAS.forEach(c => {
        const input = document.getElementById(c.id);
        if (input) Array.from(input.files).forEach(f => pares.push({ file: f, categoria: c.cat }));
      });
      return Promise.all(pares.map(p => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          // reader.result = "data:mime;base64,XXXX" -> tomamos solo la parte base64
          const base64 = String(reader.result).split(',')[1];
          resolve({
            nombre: p.file.name,
            mimeType: p.file.type || 'application/octet-stream',
            base64: base64,
            categoria: p.categoria
          });
        };
        reader.onerror = reject;
        reader.readAsDataURL(p.file);
      })));
    }

    // =======================================================
    //  UTILIDADES
    // =======================================================
    function escapar(s) {
      return String(s).replace(/[&<>"']/g, m =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function onError(err) {
      alert('Ocurrió un error: ' + (err && err.message ? err.message : err));
      console.error(err);
    }
  </script>
</body>
